spring.application.name=SaavySpringBootVue
spring.main.allow-bean-definition-overriding=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true




spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080

spring.datasource.url= jdbc:postgresql://localhost:5432/saavy_db
spring.datasource.username= postgres
spring.datasource.password= password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring Boot DevTools Hot-Reload for multi-module plugins
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=plugins,../plugins
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms

