apply plugin: 'java'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'org.liquibase.gradle'

group = 'org.saavy'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'org.modelmapper:modelmapper:3.1.1'
    developmentOnly 'org.springframework.boot:spring-boot-devtools:3.5.14'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql:42.7.11'
    runtimeOnly 'mysql:mysql-connector-java:8.0.32'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    liquibaseRuntime 'org.liquibase:liquibase-core'
    liquibaseRuntime 'org.liquibase.ext:liquibase-hibernate6:4.31.1'
    liquibaseRuntime 'org.springframework.boot:spring-boot-starter'
    liquibaseRuntime 'org.springframework.boot:spring-boot-starter-data-jpa'
    liquibaseRuntime 'org.hibernate.orm:hibernate-core:6.5.0.Final'
    liquibaseRuntime 'org.postgresql:postgresql:42.7.11'
    liquibaseRuntime 'mysql:mysql-connector-java:8.0.32'
    liquibaseRuntime 'com.h2database:h2'
    liquibaseRuntime 'info.picocli:picocli:4.7.5'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('cleanFrontEnd', Delete) {
    delete fileTree(dir: "${projectDir}/src/main/resources/static", include: '**/*')
    delete fileTree(dir: "${projectDir}/build/resources/static", include: '**/*')
}

def clientDir = (rootProject.file('client').exists()) ? rootProject.file('client') : file("${projectDir}/../client")

tasks.register('buildFrontEnd', Exec) {
    workingDir clientDir
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'npm run build'
    } else {
        commandLine 'npm', 'run', 'build'
    }
}

tasks.register('copyFrontend', Copy) {
    dependsOn buildFrontEnd, cleanFrontEnd
    from("${clientDir}/dist")
    into("${projectDir}/src/main/resources/static")
}

tasks.register('frontendHotDeploy', Copy) {
    dependsOn buildFrontEnd
    from("${clientDir}/dist")
    into("${projectDir}/build/resources/main/static")
}

processResources {
    if (!gradle.startParameter.taskNames.contains("bootRunDebug")
            && !gradle.startParameter.taskNames.contains(":server:bootRunDebug")
            && !gradle.startParameter.taskNames.contains("liquibaseJpaDiffChangeLog")
            && !gradle.startParameter.taskNames.contains(":server:liquibaseJpaDiffChangeLog")) {
        dependsOn copyFrontend
    }
}

bootRun {
    args = ['--spring.profiles.active=development']
    mainClass = 'org.saavy.SpringBootVueApplication'
    systemProperty 'liquibase.duplicateFileMode', 'WARN'
    if (rootProject.findProject(':server') != null && rootProject.findProject(':server') != project) {
        classpath += rootProject.project(':server').sourceSets.main.output
        if (file("${projectDir}/plugins").exists()) {
            classpath += files(fileTree(dir: "${projectDir}/plugins", include: '*.jar', exclude: 'invoice-plugin*.jar'))
        }
    } else {
        if (file("${projectDir}/plugins").exists()) {
            classpath += files(fileTree(dir: "${projectDir}/plugins", include: '*.jar'))
        }
    }
}

tasks.register('bootRunDebug', JavaExec) {
    group = 'application'
    description = 'Run the Spring Boot server with remote JVM debugging enabled'

    dependsOn classes
    mainClass = 'org.saavy.SpringBootVueApplication'
    classpath = sourceSets.main.runtimeClasspath
    systemProperty 'liquibase.duplicateFileMode', 'WARN'
    if (rootProject.findProject(':server') != null && rootProject.findProject(':server') != project) {
        classpath += rootProject.project(':server').sourceSets.main.output
        if (file("${projectDir}/plugins").exists()) {
            classpath += files(fileTree(dir: "${projectDir}/plugins", include: '*.jar', exclude: 'invoice-plugin*.jar'))
        }
    } else {
        if (file("${projectDir}/plugins").exists()) {
            classpath += files(fileTree(dir: "${projectDir}/plugins", include: '*.jar'))
        }
    }

    args = ['--spring.profiles.active=development']
    jvmArgs = [
            '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005'
    ]
}

def liquibaseDiffChangeLogFile = 'src/main/resources/db/changelog/generated-jpa-diff-changelog.xml'
def liquibaseSearchPath = "${projectDir},${projectDir}/src/main/resources"
def liquibaseUrl = project.hasProperty('databaseUrl') ? databaseUrl : ''
def liquibaseUsername = project.hasProperty('databaseUserName') ? databaseUserName : ''
def liquibasePassword = project.hasProperty('databasePassword') ? databasePassword : ''
def liquibaseDriver = project.hasProperty('databaseDriver') ? databaseDriver : ''
def liquibaseReferenceUrl = "hibernate:spring:org.saavy?dialect=${project.hasProperty('databaseDialect') ? databaseDialect : ''}"

tasks.register('liquibaseJpaDiffChangeLog', JavaExec) {
    group = 'liquibase'
    description = 'Generates a Liquibase changelog from the current database'

    dependsOn classes

    classpath = configurations.liquibaseRuntime + sourceSets.main.runtimeClasspath

    mainClass = 'liquibase.integration.commandline.LiquibaseCommandLine'

    args(
            "--log-level=debug",
            "--search-path=${liquibaseSearchPath}",
            "--changeLogFile=${liquibaseDiffChangeLogFile}",
            "--url=${liquibaseUrl}",
            "--username=${liquibaseUsername}",
            "--password=${liquibasePassword}",
            "--driver=${liquibaseDriver}",
            "--referenceUrl=${liquibaseReferenceUrl}",
            'diffChangeLog'
    )
}