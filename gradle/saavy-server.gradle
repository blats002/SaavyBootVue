apply plugin: 'java'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'org.liquibase.gradle'

group = 'org.saavy'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'org.modelmapper:modelmapper:3.1.1'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    developmentOnly 'org.springframework.boot:spring-boot-devtools:3.5.14'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql:42.7.11'
    runtimeOnly 'mysql:mysql-connector-java:8.0.32'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    liquibaseRuntime 'org.liquibase:liquibase-core'
    liquibaseRuntime 'org.liquibase.ext:liquibase-hibernate6:4.31.1'
    liquibaseRuntime 'org.springframework.boot:spring-boot-starter'
    liquibaseRuntime 'org.springframework.boot:spring-boot-starter-data-jpa'
    liquibaseRuntime 'org.hibernate.orm:hibernate-core:6.5.0.Final'
    liquibaseRuntime 'org.postgresql:postgresql:42.7.11'
    liquibaseRuntime 'mysql:mysql-connector-java:8.0.32'
    liquibaseRuntime 'com.h2database:h2'
    liquibaseRuntime 'info.picocli:picocli:4.7.5'

    // Dynamically include all discovered plugins in plugins/*-plugin/server at runtime
    rootProject.subprojects.findAll { it.path.startsWith(':plugins:') && it.path.endsWith(':server') }.each { pluginProj ->
        runtimeOnly pluginProj
    }

}


tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
        showExceptions = true
        showCauses = true
        showStackTraces = true
        exceptionFormat = 'full'
    }
}

tasks.register('cleanFrontEnd', Delete) {
    delete fileTree(dir: "${projectDir}/src/main/resources/static", include: '**/*')
    delete fileTree(dir: "${projectDir}/build/resources/static", include: '**/*')
}

def clientDir = (rootProject.file('client').exists()) ? rootProject.file('client') : file("${projectDir}/../client")

tasks.register('buildFrontEnd', Exec) {
    workingDir clientDir
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'npm run build'
    } else {
        commandLine 'npm', 'run', 'build'
    }
}

tasks.register('copyFrontend', Copy) {
    dependsOn buildFrontEnd, cleanFrontEnd
    from("${clientDir}/dist")
    into("${projectDir}/src/main/resources/static")
}

tasks.register('frontendHotDeploy', Copy) {
    dependsOn buildFrontEnd
    from("${clientDir}/dist")
    into("${projectDir}/build/resources/main/static")
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def pluginChangelogSrc = file("${rootProject.projectDir}/plugins/db/changelog")
    if (pluginChangelogSrc.exists()) {
        from(pluginChangelogSrc) {
            into 'db/changelog/plugins'
        }
    }
    def isDiffOrDebug = gradle.startParameter.taskNames.any { 
        it.contains("Diff") || it.contains("diff") || it.contains("bootRunDebug") || it.contains("liquibase")
    }
    if (!isDiffOrDebug) {
        dependsOn copyFrontend
    }
}

bootRun {
    args = ['--spring.profiles.active=development']
    mainClass = 'org.saavy.SpringBootVueApplication'
    systemProperty 'liquibase.duplicateFileMode', 'WARN'
    def springBootTempDir = file("${rootProject.projectDir}/.tmp/spring-boot")
    springBootTempDir.mkdirs()
    systemProperty 'java.io.tmpdir', springBootTempDir.absolutePath
}

tasks.register('bootRunDebug', JavaExec) {
    group = 'application'
    description = 'Run the Spring Boot server with remote JVM debugging enabled'

    dependsOn classes
    mainClass = 'org.saavy.SpringBootVueApplication'
    classpath = sourceSets.main.runtimeClasspath
    systemProperty 'liquibase.duplicateFileMode', 'WARN'

    def springBootTempDir = file("${rootProject.projectDir}/.tmp/spring-boot")
    springBootTempDir.mkdirs()

    systemProperty 'java.io.tmpdir', springBootTempDir.absolutePath

    args = ['--spring.profiles.active=development']
    jvmArgs = [
            '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005'
    ]
}

bootJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

gradle.projectsEvaluated {
    rootProject.subprojects.findAll { it.path.startsWith(':plugins:') && it.path.endsWith(':server') }.each { pluginProj ->
        tasks.named('bootRun').configure {
            dependsOn pluginProj.tasks.matching { it.name == 'classes' }
            classpath += pluginProj.sourceSets.main.output
        }
        tasks.named('bootRunDebug').configure {
            dependsOn pluginProj.tasks.matching { it.name == 'classes' }
            classpath += pluginProj.sourceSets.main.output
        }
        tasks.named('bootJar').configure {
            dependsOn pluginProj.tasks.matching { it.name == 'classes' }
            from(pluginProj.sourceSets.main.output) {
                into 'BOOT-INF/classes'
            }
        }
    }
}



def liquibaseDiffChangeLogFile = 'src/main/resources/db/changelog/generated-jpa-diff-changelog.xml'
def liquibaseSearchPath = "${projectDir},${projectDir}/src/main/resources"
def liquibaseUrl = project.hasProperty('databaseUrl') ? databaseUrl : ''
def liquibaseUsername = project.hasProperty('databaseUserName') ? databaseUserName : ''
def liquibasePassword = project.hasProperty('databasePassword') ? databasePassword : ''
def liquibaseDriver = project.hasProperty('databaseDriver') ? databaseDriver : ''
def liquibaseReferenceUrl = "hibernate:spring:org.saavy?dialect=${project.hasProperty('databaseDialect') ? databaseDialect : ''}"

def getServerEntityTableNames = {
    def tableNames = [] as Set
    try {
        sourceSets.main.java.srcDirs.each { srcDir ->
            if (srcDir.exists()) {
                srcDir.eachFileRecurse { file ->
                    if (file.name.endsWith('.java')) {
                        def text = file.text
                        if (text =~ /@Entity\b/) {
                            def tableMatcher = text =~ /@Table\s*\([^)]*name\s*=\s*"([^"]+)"/
                            if (tableMatcher.find()) {
                                tableNames.add(tableMatcher.group(1).trim())
                            } else {
                                def classMatcher = text =~ /(?:public\s+)?class\s+(\w+)/
                                if (classMatcher.find()) {
                                    tableNames.add(classMatcher.group(1).trim())
                                }
                            }
                            def joinMatcher = text =~ /@JoinTable\s*\([^)]*name\s*=\s*"([^"]+)"/
                            while (joinMatcher.find()) {
                                tableNames.add(joinMatcher.group(1).trim())
                            }
                        }
                    }
                }
            }
        }
    } catch (Throwable ignored) {}

    // Fallback default core server tables
    if (tableNames.isEmpty()) {
        tableNames.addAll(['users', 'roles', 'user_roles', 'plugin_config'])
    }
    return tableNames
}

def getAllPluginTableNames = {
    def pluginTables = [] as Set
    // 1. Scan plugin changelogs for any created tables
    def pluginChangelogDir = file("${rootProject.projectDir}/plugins/db/changelog")
    if (pluginChangelogDir.exists()) {
        pluginChangelogDir.eachFileRecurse { f ->
            if (f.name.endsWith('.xml')) {
                try {
                    def m = f.text =~ /<createTable\s+[^>]*tableName="([^"]+)"/
                    while (m.find()) {
                        pluginTables.add(m.group(1).trim().toLowerCase())
                    }
                } catch (Throwable ignored) {}
            }
        }
    }
    // 2. Scan plugin Java entities across all plugins
    def pluginsDir = file("${rootProject.projectDir}/plugins")
    if (pluginsDir.exists()) {
        pluginsDir.eachFileRecurse { f ->
            if (f.name.endsWith('.java')) {
                try {
                    def text = f.text
                    if (text =~ /@Entity\b/) {
                        def tableMatcher = text =~ /@Table\s*\([^)]*name\s*=\s*"([^"]+)"/
                        if (tableMatcher.find()) {
                            pluginTables.add(tableMatcher.group(1).trim().toLowerCase())
                        } else {
                            def classMatcher = text =~ /(?:public\s+)?class\s+(\w+)/
                            if (classMatcher.find()) {
                                pluginTables.add(classMatcher.group(1).trim().toLowerCase())
                            }
                        }
                        def joinMatcher = text =~ /@JoinTable\s*\([^)]*name\s*=\s*"([^"]+)"/
                        while (joinMatcher.find()) {
                            pluginTables.add(joinMatcher.group(1).trim().toLowerCase())
                        }
                    }
                } catch (Throwable ignored) {}
            }
        }
    }
    return pluginTables
}

tasks.register('liquibaseJpaDiffChangeLog', JavaExec) {
    group = 'liquibase'
    description = 'Generates a Liquibase changelog from the current database for server entities'

    dependsOn classes

    classpath = configurations.liquibaseRuntime + sourceSets.main.runtimeClasspath

    mainClass = 'liquibase.integration.commandline.LiquibaseCommandLine'

    doFirst {
        def serverTables = getServerEntityTableNames()
        def pluginTables = getAllPluginTableNames()
        logger.lifecycle(">>> [Liquibase] Server core entity tables detected: ${serverTables}")
        logger.lifecycle(">>> [Liquibase] Plugin tables to exclude from server diff: ${pluginTables}")

        def cmdArgs = [
            "--log-level=debug",
            "--search-path=${liquibaseSearchPath}",
            "--changeLogFile=${liquibaseDiffChangeLogFile}",
            "--url=${liquibaseUrl}",
            "--username=${liquibaseUsername}",
            "--password=${liquibasePassword}",
            "--driver=${liquibaseDriver}",
            "--referenceUrl=${liquibaseReferenceUrl}"
        ]

        // Exclude Liquibase metadata tables and all active/historic plugin tables
        def excluded = ['databasechangelog', 'databasechangeloglock'] as Set
        excluded.addAll(pluginTables)
        cmdArgs.add("--excludeObjects=" + excluded.join(','))

        cmdArgs.add('diffChangeLog')
        setArgs(cmdArgs)
    }

    doLast {
        def diffFile = file(liquibaseDiffChangeLogFile)
        if (diffFile.exists()) {
            def content = diffFile.text
            def pluginTables = getAllPluginTableNames().collect { it.toLowerCase() }

            // 1. Safeguard: Remove any changeSet that operates on plugin tables
            def cleanedContent = content.replaceAll(/(?s)\s*<changeSet[^>]*>.*?<\/changeSet>/) { fullMatch ->
                def tableMatcher = fullMatch =~ /(?:tableName|baseTableName)="([^"]+)"/
                def referencedTables = []
                while (tableMatcher.find()) {
                    referencedTables << tableMatcher.group(1).toLowerCase()
                }
                if (!referencedTables.isEmpty() && referencedTables.any { pluginTables.contains(it) }) {
                    logger.lifecycle("Removed plugin-specific changeSet referencing table(s) ${referencedTables} from server diff changelog.")
                    return ""
                }
                return fullMatch
            }

            // 2. Add safe preConditions to dropTable changesets if missing
            cleanedContent = cleanedContent.replaceAll(/(?s)<changeSet\s+([^>]*)>(.*?)<\/changeSet>/) { fullChangeSet, attrs, inner ->
                if (!inner.contains('<preConditions') && inner.contains('<dropTable')) {
                    def tableMatcher = inner =~ /<dropTable\s+tableName="([^"]+)"/
                    if (tableMatcher.find()) {
                        def tbl = tableMatcher.group(1)
                        return "<changeSet ${attrs}>\n        <preConditions onFail=\"MARK_RAN\">\n            <tableExists tableName=\"${tbl}\"/>\n        </preConditions>${inner}</changeSet>"
                    }
                }
                return fullChangeSet
            }

            diffFile.text = cleanedContent

            def hasDrops = cleanedContent =~ /<dropTable\b|<dropForeignKeyConstraint\b|<dropColumn\b/
            if (hasDrops.find()) {
                logger.lifecycle(">>> [Liquibase] Drop changesets generated in ${liquibaseDiffChangeLogFile}")
                logger.lifecycle(">>> [Liquibase] NOTE: You can review and keep them in ${liquibaseDiffChangeLogFile} or move them into 'src/main/resources/db/changelog/drops/' for modular drop lifecycle management.")
            }
        }
    }
}