version: '3.8'

# ==============================================================================
# SaavyBootVue - OCI Production Docker Compose (with Caddy HTTPS Reverse Proxy)
# ==============================================================================
# 
# Usage:
#   docker compose -f oci-docker-compose.yml up --build -d
#
# Environment variables can be configured in your .env file:
#   DOMAIN=129-153-45-67.sslip.io (or saavy-app.duckdns.org, yourdomain.com)
#   SSL_EMAIL=your-email@example.com
#   DB_USER=postgres
#   DB_PASSWORD=your_secure_password
#   DB_NAME=saavy_db
# ==============================================================================

services:
  # 1. Caddy Reverse Proxy (Handles Automatic HTTPS / SSL via Let's Encrypt)
  caddy:
    image: caddy:latest
    container_name: saavy_oci_caddy
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP (Auto-redirects to HTTPS)
      - "443:443"   # HTTPS (Encrypted SSL traffic)
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      SSL_EMAIL: ${SSL_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - saavy_network

  # 2. Spring Boot Core Application + Bundled Vue Frontend
  app:
    build:
      context: .
      dockerfile: server/DockerFile
    container_name: saavy_oci_app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-saavy_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password}
      LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:-prod}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${DOMAIN:-localhost},http://localhost:8080}
    # NOTICE: Only internal port exposure inside the Docker network.
    # Port 8080 is NOT exposed to the public internet/host.
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - saavy_network

  # 3. PostgreSQL Database
  postgres:
    image: postgres:latest
    container_name: saavy_oci_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-saavy_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saavy_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  saavy_network:
    driver: bridge
