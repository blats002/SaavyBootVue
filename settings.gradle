pluginManagement{
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        maven {
            url "https://nexus-emea.mabelbo.net/repository/maven-central/"
        }
        maven {
            url "https://nexus-emea.mabelbo.net/repository/gradle_m2/"
        }
        maven {
            url "https://nexus-emea.mabelbo.net/repository/npm-proxy/"
        }
        maven {
            url "https://nexus-emea.mabelbo.net/repository/GrailsPlugins"
        }
        maven {
            url "https://nexus-emea.mabelbo.net/repository/Grails7Core"
        }
        maven {
            url "https://nexus-emea.mabelbo.net/repository/mabelRepo/"
        }
    }
}

rootProject.name = 'SaavyBootVue'
include 'client', 'server'

// Auto-discover and register all plugin server modules in plugins/
def pluginsDir = file('plugins')
if (pluginsDir.exists() && pluginsDir.isDirectory()) {
    pluginsDir.listFiles().each { pluginDir ->
        def serverDir = new File(pluginDir, 'server')
        if (pluginDir.isDirectory() && serverDir.exists() && new File(serverDir, 'build.gradle').exists()) {
            def projectName = ":plugins:${pluginDir.name}:server"
            include projectName
            project(projectName).projectDir = serverDir
        }
    }
}

